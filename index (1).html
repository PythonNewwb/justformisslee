<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CE Pop Quiz 📐</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg1:#fff3fa;--bg2:#ffb3dc;--bg3:#d4c2ff;--bg4:#ffd9b8;--bg5:#b9f0e4;--card:rgba(255,255,255,.78);--soft:rgba(255,45,135,.09);--text:#2b0825;--muted:#5e2356;--rose:#ff2d87;--rose2:#ff8ccb;--lilac:#b57cff;--gold:#ffb81c;--line:rgba(255,45,135,.24);--shadow:0 30px 70px rgba(255,45,135,.3);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#240b2e;--bg2:#5a1451;--bg3:#2b1b63;--bg4:#4a1d3a;--bg5:#10384a;--card:rgba(58,22,74,.76);--soft:rgba(255,255,255,.08);--text:#fff0f9;--muted:#f0bde0;--rose:#ff5fa8;--rose2:#ffa3d3;--lilac:#c9a0ff;--gold:#ffd04b;--line:rgba(255,154,181,.28);--shadow:0 30px 70px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg1:#240b2e;--bg2:#5a1451;--bg3:#2b1b63;--bg4:#4a1d3a;--bg5:#10384a;--card:rgba(58,22,74,.76);--soft:rgba(255,255,255,.08);--text:#fff0f9;--muted:#f0bde0;--rose:#ff5fa8;--rose2:#ffa3d3;--lilac:#c9a0ff;--gold:#ffd04b;--line:rgba(255,154,181,.28);--shadow:0 30px 70px rgba(0,0,0,.55)}
html,body{height:100%;margin:0}
body{font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;overflow:hidden;
background:radial-gradient(60% 50% at 12% 6%,var(--bg2),transparent 70%),radial-gradient(55% 50% at 94% 10%,var(--bg4),transparent 70%),radial-gradient(60% 55% at 90% 94%,var(--bg3),transparent 70%),radial-gradient(50% 45% at 6% 92%,var(--bg5),transparent 70%),var(--bg1)}
#fl{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fl span{position:absolute;bottom:-60px;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg)}}
.card{position:relative;z-index:2;width:min(92vw,440px);max-width:100%;max-height:92%;overflow-y:auto;box-sizing:border-box;padding:clamp(22px,6vw,34px) clamp(20px,6vw,30px);text-align:center;background:var(--card);background-image:linear-gradient(165deg,var(--accs,transparent),transparent 65%);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:2px solid rgba(255,255,255,.85);outline:2px dashed var(--acc,var(--line));outline-offset:-10px;border-radius:36px;box-shadow:var(--shadow),inset 0 0 40px rgba(255,255,255,.5);animation:enter .6s cubic-bezier(.2,1.1,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.steps i{width:28px;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:linear-gradient(90deg,var(--rose),var(--lilac))}
.ico{display:inline-block;font-size:clamp(58px,17vw,78px);line-height:1;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px) rotate(4deg)}}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(26px,7.4vw,34px);line-height:1.15;margin:12px 0 6px;letter-spacing:-.01em}
h1.hot{color:#c4085c;text-shadow:0 2px 0 rgba(255,255,255,.7)}
p{font-size:clamp(16px,4.4vw,19px);line-height:1.55;color:var(--muted);margin:10px 0}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{font-weight:700;font-size:18px;border:0;border-radius:999px;padding:15px 34px;color:#fff;background:linear-gradient(135deg,#ff2d87,#ff6fb5 55%,#c77dff);box-shadow:0 10px 24px rgba(255,45,135,.45),inset 0 2px 0 rgba(255,255,255,.45);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btns{margin-top:22px;display:flex;justify-content:center}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{font-weight:700;font-size:17px;padding:14px 18px;border-radius:18px;border:2px solid var(--acc,var(--line));background:rgba(255,255,255,.55);color:var(--text);transition:transform .12s,border-color .12s,background .12s}
.opt:hover{background:var(--accs,rgba(255,140,203,.25))}
.opt:active{transform:scale(.98)}
.opt.good{border-color:var(--rose);background:var(--accs,rgba(255,45,135,.22));box-shadow:0 0 0 3px var(--accs,rgba(255,45,135,.2))}
#msg{min-height:26px;font-size:16px}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px) rotate(-1.5deg)}60%{transform:translateX(9px) rotate(1.5deg)}}
.line{opacity:0;transform:translateY(12px);animation:in .8s forwards}
@keyframes in{to{opacity:1;transform:none}}
.like{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(44px,13vw,60px);line-height:1.05;margin:26px 0 6px;color:#c4085c;text-shadow:0 3px 0 rgba(255,255,255,.85),0 0 20px rgba(255,45,135,.35);animation:thump 1.1s ease-in-out infinite}
@keyframes thump{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}45%{transform:scale(1.06)}}
@keyframes shine{to{background-position:200% center}}
#yesbox{display:flex;justify-content:center;padding:16px 0 22px}
#yes{font-size:25px;padding:18px 46px;box-shadow:0 0 0 0 rgba(255,45,135,.55),0 10px 24px rgba(255,45,135,.45);animation:ring 1.6s ease-out infinite}
@keyframes ring{to{box-shadow:0 0 0 18px rgba(255,45,135,0),0 10px 24px rgba(255,45,135,.45)}}
#zone{position:relative;height:130px;border-radius:22px;background:var(--soft);border:1.5px dashed var(--line);overflow:hidden}
#zone small{position:absolute;left:0;right:0;bottom:7px;font-size:13px;color:var(--muted)}
#no{position:absolute;font-weight:700;font-size:17px;padding:10px 22px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--text);transition:left .25s cubic-bezier(.3,1.6,.5,1),top .25s cubic-bezier(.3,1.6,.5,1),transform .2s}
.from{font-family:Fraunces,Georgia,serif;font-size:19px;color:var(--text)}
.mini{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:18px;padding:12px 14px;border-radius:20px;background:linear-gradient(135deg,#e01a78,#8f4fe0);color:#fff;text-align:left;box-shadow:0 10px 24px rgba(255,45,135,.35)}
.mart{width:50px;height:50px;border-radius:12px;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.mtx{flex:1;min-width:0;display:flex;flex-direction:column}
.mtx small{color:#fff3a0;font-size:12px}
.mtx b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtx span{color:#fff;font-size:14px}
#mp{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:#ff2d87;font-size:20px;padding:0}
.pbar{flex-basis:100%;height:4px;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:#fff}
.garden{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;pointer-events:none;z-index:1;padding-bottom:env(safe-area-inset-bottom,0px)}
.garden span{display:inline-block;transform-origin:50% 100%;transform:scale(0);animation:grow 1s cubic-bezier(.3,1.6,.5,1) forwards,sway 3s ease-in-out infinite}
@keyframes grow{to{transform:scale(1)}}
@keyframes sway{50%{rotate:9deg}}
.petal{position:fixed;top:-50px;z-index:6;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(260deg)}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
.lt{display:inline-block;opacity:0;transform:translateY(16px) scale(.5);animation:lt .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes lt{to{opacity:1;transform:none}}
.trail{position:fixed;z-index:9;pointer-events:none;line-height:1;transform:translate(-50%,-50%);animation:trail .85s ease-out forwards}
@keyframes trail{to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2) rotate(120deg)}}
.hrt{position:fixed;z-index:8;pointer-events:none;animation:hrt 2.4s ease-out forwards}
@keyframes hrt{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),-130px) scale(1.2)}}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{font-weight:700;font-size:16px;padding:13px 8px;border-radius:18px;border:2px solid var(--line);background:rgba(255,255,255,.6);color:var(--text);transition:transform .12s,background .12s,border-color .12s}
.chip:active{transform:scale(.97)}
.chip.on{border-color:var(--rose);background:linear-gradient(135deg,rgba(255,45,135,.2),rgba(181,124,255,.28))}
.ghost{margin-top:14px;font-weight:700;font-size:15px;border-radius:999px;padding:9px 20px;border:2px solid var(--line);background:transparent;color:var(--muted)}
#no.yes2{font-size:18px;padding:14px 26px;border-color:transparent;color:#fff;background:linear-gradient(135deg,#ff2d87,#ff6fb5 55%,#c77dff);box-shadow:0 10px 24px rgba(255,45,135,.45),inset 0 2px 0 rgba(255,255,255,.45)}

.tp{margin:10px 0}
.caret::after{content:'';display:inline-block;width:2px;height:1.05em;margin-left:3px;vertical-align:-.15em;background:#c4085c;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.dt{width:100%;box-sizing:border-box;font:inherit;font-weight:700;font-size:17px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.8);color:var(--text);color-scheme:light}
.dt:focus{outline:3px solid var(--gold);outline-offset:2px}
.lbl{display:block;text-align:left;font-weight:700;font-size:15px;color:var(--text);margin:16px 0 6px}
.row2{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.back{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font-weight:700;font-size:14px;padding:6px 14px}
</style>
</head>

// 🌷 tulip explosion
function drawTulip(x, size, col, shade, light, noStem) {
  x.lineCap = 'round';
  if (!noStem) {
  x.strokeStyle = '#3fbf6e'; x.lineWidth = size * .09;
  x.beginPath(); x.moveTo(0, size * .3); x.quadraticCurveTo(size * .06, size * .8, 0, size * 1.25); x.stroke();
  x.fillStyle = '#58d68d';
  x.beginPath(); x.moveTo(0, size * 1.0); x.quadraticCurveTo(size * .5, size * .85, size * .42, size * .5); x.quadraticCurveTo(size * .12, size * .7, 0, size * 1.0); x.fill();
  }
  // back petals
  x.fillStyle = shade;
  x.beginPath(); x.moveTo(-size * .42, -size * .5); x.quadraticCurveTo(-size * .56, size * .12, 0, size * .38); x.quadraticCurveTo(-size * .1, -size * .1, -size * .42, -size * .5); x.fill();
  x.beginPath(); x.moveTo(size * .42, -size * .5); x.quadraticCurveTo(size * .56, size * .12, 0, size * .38); x.quadraticCurveTo(size * .1, -size * .1, size * .42, -size * .5); x.fill();
  // front petal
  var g = x.createLinearGradient(0, -size * .6, 0, size * .4);
  g.addColorStop(0, light); g.addColorStop(1, col);
  x.fillStyle = g;
  x.beginPath(); x.moveTo(-size * .3, -size * .42); x.quadraticCurveTo(-size * .38, size * .22, 0, size * .4); x.quadraticCurveTo(size * .38, size * .22, size * .3, -size * .42);
  x.lineTo(size * .14, -size * .2); x.lineTo(0, -size * .66); x.lineTo(-size * .14, -size * .2); x.closePath(); x.fill();
  // shine
  x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = size * .05;
  x.beginPath(); x.moveTo(-size * .14, -size * .05); x.quadraticCurveTo(-size * .18, size * .12, -size * .06, size * .26); x.stroke();
}

function tulipBurst(ox, oy) {
  var id = ++burstId;
  sSparkle(); buzz([60, 40, 100, 40, 160]);
  var c = document.getElementById('t'), x = c.getContext('2d');
  var dpr = Math.min(devicePixelRatio || 1, 2);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  x.scale(dpr, dpr);
  var W = innerWidth, H = innerHeight, u = Math.min(W, H) / 700 + .55;
  var pal = [['#ff2d87','#d4156b','#ff9ccc'],['#ff6fb5','#e04b97','#ffd0e8'],['#ffb81c','#e09a00','#fff0a8'],['#b57cff','#8f55e0','#e4d0ff'],['#ff5a5f','#d93a40','#ffb3b5'],['#ffffff','#f3c6df','#ffffff']];
  var ps = [], sparks = [];
  function launch(n, px, py, power, delay) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = (5 + Math.random() * 12) * power * u;
      ps.push({x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4 * u, rot: a + Math.PI / 2, vr: (Math.random() - .5) * .16,
        size: (26 + Math.random() * 38) * u, pal: pal[(Math.random() * pal.length) | 0], t: -delay, life: 150 + Math.random() * 70});
    }
    for (var j = 0; j < 40; j++) {
      var b = Math.random() * Math.PI * 2, v = (3 + Math.random() * 11) * power * u;
      sparks.push({x: px, y: py, vx: Math.cos(b) * v, vy: Math.sin(b) * v, r: 2 + Math.random() * 3, t: -delay, col: ['#fff','#ffe066','#ff8ccb','#d4b5ff'][j % 4]});
    }
  }
  launch(36, ox, oy, 1, 0);
  setTimeout(function(){ launch(26, W * .2, H * .6, .85, 0); launch(26, W * .8, H * .6, .85, 0); }, 650);
  setTimeout(function(){ launch(30, W / 2, H * .45, 1.05, 0); }, 1300);
  var f = 0, ring = 0;
  (function loop() {
    x.clearRect(0, 0, W, H);
    if (id !== burstId) return;
    f++; ring += 1;
    if (ring < 28) { // shockwave
      x.save(); x.globalAlpha = 1 - ring / 28; x.lineWidth = 10 * (1 - ring / 28) + 1; x.strokeStyle = '#ff8ccb';
      x.beginPath(); x.arc(ox, oy, ring * 22 * u, 0, 7); x.stroke(); x.restore();
    }
    sparks.forEach(function(p){
      p.t++; if (p.t < 0 || p.t > 55) return;
      p.x += p.vx; p.y += p.vy; p.vy += .18; p.vx *= .97;
      x.globalAlpha = 1 - p.t / 55; x.fillStyle = p.col;
      x.beginPath(); x.arc(p.x, p.y, p.r * (1 - p.t / 80), 0, 7); x.fill();
    });
    var alive = 0;
    ps.forEach(function(p){
      p.t++; if (p.t < 0) { alive++; return; }
      if (p.t > p.life) return;
      alive++;
      p.x += p.vx; p.y += p.vy; p.vy += .22 * u; p.vx *= .985; p.vy *= .995; p.rot += p.vr;
      var grow = Math.min(1, .2 + p.t / 14), fade = p.t > p.life - 30 ? (p.life - p.t) / 30 : 1;
      x.save(); x.globalAlpha = Math.max(0, fade); x.translate(p.x, p.y); x.rotate(p.rot); x.scale(grow, grow);
      drawTulip(x, p.size, p.pal[0], p.pal[1], p.pal[2]);
      x.restore();
    });
    if (alive) requestAnimationFrame(loop); else x.clearRect(0, 0, W, H);
  })();
}

function easeBack(t) { var c = 2.70158; return 1 + c * Math.pow(t - 1, 3) + (c - 1) * Math.pow(t - 1, 2); }
function leaf(x, ox, oy, len, dir) {
  x.beginPath(); x.moveTo(ox, oy);
  x.quadraticCurveTo(dir * len * .75, oy - len * .1, dir * len * .55, oy - len * .8);
  x.quadraticCurveTo(dir * len * .1, oy - len * .45, ox, oy); x.fill();
}
function garden() {
  var old = document.getElementById('g'); if (old) old.remove();
  var c = document.createElement('canvas'); c.id = 'g'; c.style.zIndex = 1; document.body.appendChild(c);
  var dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  var x = c.getContext('2d'), u = Math.min(W, H) / 700 + .55, n = W < 500 ? 9 : 15;
  var P = [['#ff2d87','#d4156b','#ff9ccc'],['#ff6fb5','#e04b97','#ffd0e8'],['#ffb81c','#e09a00','#fff0a8'],['#b57cff','#8f55e0','#e4d0ff'],['#ff5a5f','#d93a40','#ffb3b5'],['#ffffff','#f3c6df','#ffffff']];
  var T = [];
  for (var i = 0; i < n; i++) T.push({x: (i + .5 + (Math.random() - .5) * .6) / n * W, h: (70 + Math.random() * 130) * u, s: (22 + Math.random() * 18) * u, d: i * 140 + Math.random() * 200, ph: Math.random() * 6, pal: P[(Math.random() * P.length) | 0]});
  var t0 = performance.now();
  (function loop(now) {
    x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
    T.forEach(function(p){
      var k = Math.max(0, Math.min(1, (now - t0 - p.d) / 1500));
      if (k <= 0) return;
      var sp = 1 - Math.pow(1 - Math.min(k / .7, 1), 3), b = k > .6 ? easeBack((k - .6) / .4) : 0;
      var ht = p.h * sp;
      x.save(); x.translate(p.x, H + 4); x.rotate(Math.sin(now / 900 + p.ph) * .05 * sp);
      x.strokeStyle = '#3fbf6e'; x.lineWidth = p.s * .14; x.lineCap = 'round';
      x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(p.s * .15, -ht * .5, 0, -ht); x.stroke();
      x.fillStyle = '#58d68d'; leaf(x, 0, -ht * .22, p.s * 1.5 * sp, 1); leaf(x, 0, -ht * .4, p.s * 1.25 * sp, -1);
      x.translate(0, -ht - p.s * .3); var sc = .25 + .75 * b; x.scale(sc, sc);
      drawTulip(x, p.s, p.pal[0], p.pal[1], p.pal[2], true);
      x.restore();
    });
    gRAF = requestAnimationFrame(loop);
  })(performance.now());
}

function confetti() {
  var c = document.getElementById('c'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  var cols = ['#ff2d87','#ff8ccb','#ffb81c','#ffe066','#7ae5c8','#b57cff'];
  var ps = [];
  for (var i = 0; i < 160; i++) ps.push({x: Math.random() * c.width, y: -20 - Math.random() * c.height * .6, r: 4 + Math.random() * 6, vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4, col: cols[i % 6], rot: Math.random() * 6});
  var t = 0;
  (function f() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(function(p){ p.y += p.vy; p.x += p.vx; p.rot += .12; x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.fillStyle = p.col; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); });
    if (++t < 300) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height);
  })();
}

intro();
</script>
