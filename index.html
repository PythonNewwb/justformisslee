<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CE Pop Quiz 📐</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg1:#fff3fa;--bg2:#ffb3dc;--bg3:#d4c2ff;--bg4:#ffd9b8;--bg5:#b9f0e4;--card:rgba(255,255,255,.78);--soft:rgba(255,45,135,.09);--text:#4a123f;--muted:#7a3f72;--rose:#ff2d87;--rose2:#ff8ccb;--lilac:#b57cff;--gold:#ffb81c;--line:rgba(255,45,135,.24);--shadow:0 30px 70px rgba(255,45,135,.3);
--btn-fg:#4a123f;--btn-bg:linear-gradient(135deg,#ffc3de,#ffdcf0 55%,#ded0ff);--btn-brd:rgba(255,45,135,.5);--btn-sh:0 10px 22px rgba(255,45,135,.22),inset 0 2px 0 rgba(255,255,255,.9);
--chip-fg:#4a123f;--chip-brd:rgba(255,45,135,.5);--chip-bg:rgba(255,255,255,.72);--chip-hov:#ffd9ec;--good-fg:#4a123f;--hot:#c2145f;--accent:#d4156b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#240b2e;--bg2:#5a1451;--bg3:#2b1b63;--bg4:#4a1d3a;--bg5:#10384a;--card:rgba(58,22,74,.76);--soft:rgba(255,255,255,.08);--text:#fff0f9;--muted:#f0bde0;--rose:#ff5fa8;--rose2:#ffa3d3;--lilac:#c9a0ff;--gold:#ffd04b;--line:rgba(255,154,181,.28);--shadow:0 30px 70px rgba(0,0,0,.55);
--btn-fg:#ffffff;--btn-bg:linear-gradient(135deg,#e01a6e,#e04b97 55%,#9b4fe0);--btn-brd:transparent;--btn-sh:0 10px 24px rgba(255,45,135,.45),inset 0 2px 0 rgba(255,255,255,.45);
--chip-fg:#fff0f9;--chip-brd:rgba(255,154,181,.28);--chip-bg:rgba(255,255,255,.1);--chip-hov:rgba(255,255,255,.2);--good-fg:#fff0f9;--hot:#ff5fa8;--accent:#ff8ccb;}}
:root[data-theme="dark"]{--bg1:#240b2e;--bg2:#5a1451;--bg3:#2b1b63;--bg4:#4a1d3a;--bg5:#10384a;--card:rgba(58,22,74,.76);--soft:rgba(255,255,255,.08);--text:#fff0f9;--muted:#f0bde0;--rose:#ff5fa8;--rose2:#ffa3d3;--lilac:#c9a0ff;--gold:#ffd04b;--line:rgba(255,154,181,.28);--shadow:0 30px 70px rgba(0,0,0,.55);
--btn-fg:#ffffff;--btn-bg:linear-gradient(135deg,#e01a6e,#e04b97 55%,#9b4fe0);--btn-brd:transparent;--btn-sh:0 10px 24px rgba(255,45,135,.45),inset 0 2px 0 rgba(255,255,255,.45);
--chip-fg:#fff0f9;--chip-brd:rgba(255,154,181,.28);--chip-bg:rgba(255,255,255,.1);--chip-hov:rgba(255,255,255,.2);--good-fg:#fff0f9;--hot:#ff5fa8;--accent:#ff8ccb;}
html,body{height:100%;margin:0}
body{font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;overflow:hidden;
background:radial-gradient(60% 50% at 12% 6%,var(--bg2),transparent 70%),radial-gradient(55% 50% at 94% 10%,var(--bg4),transparent 70%),radial-gradient(60% 55% at 90% 94%,var(--bg3),transparent 70%),radial-gradient(50% 45% at 6% 92%,var(--bg5),transparent 70%),var(--bg1)}
#fl{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fl span{position:absolute;bottom:-60px;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg)}}
.card{--acc:#ff8ccb;--acc2:#ffd0e8;position:relative;z-index:2;width:min(92vw,440px);max-width:100%;max-height:92%;overflow-y:auto;box-sizing:border-box;padding:clamp(22px,6vw,34px) clamp(20px,6vw,30px);text-align:center;background:var(--card);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:2px solid rgba(255,255,255,.85);outline:2px dashed var(--line);outline-offset:-10px;border-radius:36px;box-shadow:var(--shadow),inset 0 0 40px rgba(255,255,255,.5);animation:enter .6s cubic-bezier(.2,1.1,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.steps i{width:28px;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:linear-gradient(90deg,var(--rose),var(--lilac))}
.ico{display:inline-block;font-size:clamp(58px,17vw,78px);line-height:1;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px) rotate(4deg)}}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(26px,7.4vw,34px);line-height:1.15;margin:12px 0 6px;letter-spacing:-.01em}
h1.hot{color:var(--hot);text-shadow:0 2px 0 rgba(255,255,255,.7)}
p{font-size:clamp(16px,4.4vw,19px);line-height:1.55;color:var(--muted);margin:10px 0}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{font-weight:700;font-size:18px;border:2px solid var(--btn-brd);border-radius:999px;padding:15px 34px;color:var(--btn-fg);background:var(--btn-bg);box-shadow:var(--btn-sh);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btns{margin-top:22px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.ghost{font-weight:700;font-size:15px;border-radius:999px;padding:11px 20px;border:2px solid var(--chip-brd);background:var(--chip-bg);color:var(--chip-fg)}
.opts{display:grid;gap:10px;margin-top:18px}
.datepick{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:20px;padding:16px;border-radius:22px;background:var(--soft);border:2px dashed var(--line)}
.datepick label{font-weight:700;font-size:15px;color:var(--muted)}
.datepick input[type="date"]{font:inherit;font-weight:700;font-size:17px;color:var(--chip-fg);background:var(--chip-bg);border:2px solid var(--chip-brd);border-radius:14px;padding:11px 14px;min-height:48px;cursor:pointer}
.datepick input[type="date"]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.datepick input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.7}
.datepick input[type="date"]::-webkit-calendar-picker-indicator:hover{opacity:1}
.datepick .btn{font-size:16px;padding:12px 24px}
.opt{font-weight:700;font-size:17px;padding:14px 18px;border-radius:18px;border:2px solid var(--chip-brd);background:var(--chip-bg);color:var(--chip-fg);transition:transform .12s,border-color .12s,background .12s;box-shadow:0 3px 0 var(--acc2)}
.opt:hover{background:var(--chip-hov)}
.opt:active{transform:scale(.98)}
.opt.good{border-color:var(--rose);color:var(--good-fg);background:linear-gradient(135deg,rgba(255,45,135,.22),rgba(181,124,255,.25))}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
.when{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(19px,5vw,22px);color:var(--hot);margin:10px 0 4px}
.qacc .steps i.on{background:linear-gradient(90deg,var(--acc),var(--lilac))}
.qacc h1{text-shadow:0 3px 0 var(--acc2)}
#msg{min-height:26px;font-size:16px}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px) rotate(-1.5deg)}60%{transform:translateX(9px) rotate(1.5deg)}}
.line{opacity:0;transform:translateY(12px);animation:in .8s forwards;min-height:1.7em}
.caret{display:inline-block;width:2px;height:1.05em;vertical-align:-.16em;background:var(--rose);-webkit-text-fill-color:var(--rose);color:var(--rose);margin-left:2px;animation:blink .75s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.popin{animation:in .8s forwards,popin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.7)}to{transform:scale(1)}}
@keyframes in{to{opacity:1;transform:none}}
.likewrap{position:relative;margin:26px 0 6px}
.like{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(44px,13vw,60px);line-height:1;min-height:2em;background:linear-gradient(90deg,var(--rose),var(--lilac),var(--gold),var(--rose));background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 16px rgba(255,45,135,.5));animation:thump 1.1s ease-in-out infinite,shine 2.4s linear infinite}
@keyframes thump{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}45%{transform:scale(1.06)}}
@keyframes shine{to{background-position:200% center}}
.hrt{position:absolute;pointer-events:none;animation:hup 2s ease-out forwards}
@keyframes hup{to{transform:translate(var(--dx),-120px) scale(1.3);opacity:0}}
#yesbox{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:16px 0 22px}
#yes,#yes2{font-size:25px;padding:18px 46px;box-shadow:0 0 0 0 rgba(255,45,135,.55),0 10px 24px rgba(255,45,135,.45);animation:ring 1.6s ease-out infinite}
@keyframes ring{to{box-shadow:0 0 0 18px rgba(255,45,135,0),0 10px 24px rgba(255,45,135,.45)}}
#zone{position:relative;height:130px;border-radius:22px;background:var(--soft);border:1.5px dashed var(--line);overflow:hidden}
#zone small{position:absolute;left:0;right:0;bottom:7px;font-size:13px;color:var(--muted)}
#no{position:absolute;font-weight:700;font-size:17px;padding:10px 22px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--text);white-space:nowrap;transition:left .25s cubic-bezier(.3,1.6,.5,1),top .25s cubic-bezier(.3,1.6,.5,1),transform .2s}
.from{font-family:Fraunces,Georgia,serif;font-size:19px;color:var(--text)}
.mini{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:18px;padding:12px 14px;border-radius:20px;background:linear-gradient(135deg,#ff2d87,#b57cff);color:#fff;text-align:left;box-shadow:0 10px 24px rgba(255,45,135,.35)}
.mart{width:50px;height:50px;border-radius:12px;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.mtx{flex:1;min-width:0;display:flex;flex-direction:column}
.mtx small{color:#fff6b0;font-size:12px}
.mtx b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtx span{color:#ffe3f3;font-size:14px}
#mp{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--accent);background:#fff;color:var(--accent);font-size:20px;padding:0}
.pbar{flex-basis:100%;height:4px;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:#fff}
.garden{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;pointer-events:none;z-index:1;padding-bottom:env(safe-area-inset-bottom,0px)}
.garden span{display:inline-block;transform-origin:50% 100%;transform:scale(0);animation:grow 1s cubic-bezier(.3,1.6,.5,1) forwards,sway 3s ease-in-out infinite}
@keyframes grow{to{transform:scale(1)}}
@keyframes sway{50%{rotate:9deg}}
.petal{position:fixed;top:-50px;z-index:6;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(260deg)}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="fl"></div>
<div class="card" id="card"></div>
<canvas id="c"></canvas>
<canvas id="t" style="z-index:7"></canvas>
<canvas id="sp" style="z-index:8"></canvas>
<script>
// ✏️ PERSONALIZE THESE
var HER = "Miss Lee";   // her name
var ME = "Vince";       // your name
// song.mp3 is an ~80s clip stored NEXT TO index.html (keep both files together)
var SONG = {title:"Pwede Ka Ba", artist:"Frank Ely", spotify:"", audio:"song.mp3", clipSeconds:80};
// Where her date choice goes. Leave both blank to just show a "tell Vince" screen.
var REPLY = {sms:"", email:""};  // e.g. sms:"+639171234567"
var LINES = [
  "These past few months of talking to you have become my favorite part of the day.",
  "You make ordinary days feel lighter, and I catch myself smiling at my phone like a goofball.",
  "So I decided to be brave and tell you the truth..."
];
// 🌷 first-date options: e = emoji, t = label
var DATES = [
  {e:"☕", t:"Coffee"},
  {e:"🍜", t:"Food trip"},
  {e:"🌆", t:"A walk"},
  {e:"🎬", t:"Movie"}
];

var card = document.getElementById('card'), fl = document.getElementById('fl');
var snd = SONG.audio ? new Audio(SONG.audio) : null;
if (snd) snd.preload = 'metadata';
var timers = [], touched = false, AC = null;

function unlock() {
  if (touched) return;
  touched = true;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
['pointerdown','touchstart','click','keydown'].forEach(function(ev){ addEventListener(ev, unlock, {passive:true}); });
function tone(freq, start, dur, vol, type) {
  if (!touched || !AC) return;
  var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + start;
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .05);
}
function pop() {
  if (!touched || !AC) return;
  var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(220, t + .12);
  g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.0001, t + .15);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .2);
}
function tick() { // soft typing click
  if (!touched || !AC) return;
  var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = 'square';
  o.frequency.setValueAtTime(760 + Math.random() * 340, t);
  g.gain.setValueAtTime(.028, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + .03);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .05);
}
function sparkle() {
  [1568, 2093, 2637, 3136, 2349].forEach(function(f, i){ tone(f, i * .07, .35, .035, 'triangle'); });
}
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearAll() { timers.forEach(clearTimeout); timers = []; }

function floaters() {
  fl.innerHTML = '';
  for (var i = 0; i < 16; i++) {
    var s = document.createElement('span');
    s.textContent = ['🌸','💗','✨','🌷','🎀','🦋'][i % 4];
    s.style.left = (Math.random() * 100) + '%';
    s.style.fontSize = (16 + Math.random() * 20) + 'px';
    s.style.opacity = .5;
    s.style.animationDuration = (10 + Math.random() * 10) + 's';
    s.style.animationDelay = (-Math.random() * 18) + 's';
    fl.appendChild(s);
  }
}
floaters();

function steps(n) { var h = '<div class="steps">'; for (var i = 0; i < 5; i++) h += '<i class="' + (i <= n ? 'on' : '') + '"></i>'; return h + '</div>'; }
function show(html) { card.innerHTML = html; card.style.animation = 'none'; card.offsetHeight; card.style.animation = ''; card.classList.remove('shake'); }
function shakeCard() { card.classList.remove('shake'); card.offsetHeight; card.classList.add('shake'); buzz(25); }

function intro() {
  card.classList.remove('qacc');
  show(steps(0) + '<div class="ico">📐</div><h1>CE pop quiz!</h1><p>Four questions, ' + HER + '. Let\'s see how well you know your stuff.</p><div class="btns"><button class="btn" id="go">Start the quiz</button></div>');
  document.getElementById('go').onclick = function(){ pop(); quiz(0); };
}

var ACC = [['#ffa9cf','#ffe1ef'],['#b9a2ff','#ece4ff'],['#7fdcc4','#d8f6ee'],['#ffc48a','#ffeedb']];
var QS = [
  {ico:'👷‍♀️', h:'Quick engineering quiz!', q:'For a body in static equilibrium, the sum of all forces equals what?', o:['Zero','Its own weight','One'], a:0, s:1},
  {ico:'🏗️', h:'Quick engineering quiz!', q:'Hooke\'s law links stress and strain. What is that constant called?', o:['Modulus of elasticity','Poisson\'s ratio','Moment of inertia'], a:0, s:1},
  {ico:'📐', h:'Quick engineering quiz!', q:'In reinforced concrete, the steel bars mainly resist what?', o:['Tension','Compression','Fire'], a:0, s:1},
  {ico:'🤔', h:'Last question, ' + HER + '!', q: HER + ', who has been ' + ME + '\'s favorite person to talk to these past months?', o:['A random stranger 🧍','Me 💛','The barista ☕'], a:1, s:0}
];

function quiz(n) {
  n = n || 0;
  var q = QS[n], last = n === QS.length - 1;
  card.style.setProperty('--acc', ACC[n % ACC.length][0]);
  card.style.setProperty('--acc2', ACC[n % ACC.length][1]);
  var order = q.o.map(function(t, i){ return i; });
  if (q.s) order.sort(function(){ return Math.random() - .5; });
  var h = steps(1) + '<div class="ico">' + q.ico + '</div><h1>' + q.h + '</h1><p style="margin:2px 0;font-size:14px">Question ' + (n + 1) + ' of ' + QS.length + '</p><p>' + q.q + '</p><div class="opts">';
  order.forEach(function(i){ h += '<button class="opt" data-i="' + i + '">' + q.o[i] + '</button>'; });
  show(h + '</div><p id="msg"></p>');
  card.classList.add('qacc');
  var oops = last ? ['Nice try 😏 Try again!', 'Wrong! Even the barista says so 🙄', 'Hmm, think harder 👀'] : ['Not quite, future engineer 😅 Try again!', 'Oops, check your formulas 📐', 'So close... think again 🤔'], c = 0, done = false;
  Array.prototype.forEach.call(card.querySelectorAll('.opt'), function(b){
    b.onclick = function(){
      if (done) return;
      if (+b.getAttribute('data-i') === q.a) {
        done = true;
        pop();
        b.classList.add('good');
        document.getElementById('msg').textContent = last ? '' : 'Correct! Future engineer 👷‍♀️';
        later(function(){ card.classList.remove('qacc'); if (last) letter(); else quiz(n + 1); }, last ? 350 : 800);
      } else {
        shakeCard();
        document.getElementById('msg').textContent = oops[c++ % oops.length];
      }
    };
  });
}

function letter() {
  var h = steps(2) + '<div class="ico">🙈</div><h1>Okay, that last one wasn\'t really a quiz question</h1>';
  LINES.forEach(function(l, i){ h += '<p class="line" id="ln' + i + '"></p>'; });
  var t = LINES.length * 1.4;
  h += '<div class="likewrap"><div class="like" id="like" aria-label="I really like you"></div></div>';
  h += '<p class="line" id="lnx"></p>';
  h += '<div class="btns line" id="goBtn" style="display:none"><button class="btn" id="nx">Keep going</button></div>';
  show(h);
  document.getElementById('nx').onclick = function(){ pop(); ask(); };
  typeLines();
}

// types each message paragraph one by one, with a caret and typing click
function typeLines() {
  var i = 0;
  (function nextLine() {
    if (i >= LINES.length) { finishLines(); return; }
    var el = document.getElementById('ln' + i);
    if (!el) { finishLines(); return; }
    typeOut(el, LINES[i], 26, function() {
      later(nextLine, 420);
      i++;
    });
  })();
}
function finishLines() {
  var el = document.getElementById('lnx');
  var done = function() {
    later(typeLike, 350);
  };
  if (el) typeOut(el, "I'd like to get to know you more, at a pace you're comfortable with.", 26, done);
  else done();
}

// typewriter for one element
function typeOut(el, txt, speed, done) {
  var chars = Array.from(txt), i = 0;
  var caret = document.createElement('span');
  caret.className = 'caret';
  el.appendChild(caret);
  (function nextCh() {
    if (!el.isConnected) return;
    if (i >= chars.length) {
      if (caret.parentNode) caret.remove();
      if (done) done();
      return;
    }
    var ch = chars[i++];
    if (ch !== ' ') tick();
    el.insertBefore(document.createTextNode(ch), caret);
    later(nextCh, ch === ' ' || ch === ',' ? speed * 1.6 : speed);
  })();
}

function typeLike() {
  var el = document.getElementById('like'); if (!el) return;
  var wrap = el.parentNode, chars = Array.from('I really like you 💖'), i = 0;
  var caret = document.createElement('span');
  caret.className = 'caret';
  el.appendChild(caret);
  (function nextCh() {
    if (!document.getElementById('like')) return;
    if (i >= chars.length) {
      if (caret.parentNode) caret.remove();
      var b = document.getElementById('goBtn');
      if (b) { b.style.display = ''; b.classList.add('popin'); }
      shakeCard();
      return;
    }
    var ch = chars[i++];
    if (ch === ' ' && i === 9) {
      el.insertBefore(document.createElement('br'), caret);
      el.insertBefore(document.createTextNode(ch), caret);
    } else {
      el.insertBefore(document.createTextNode(ch), caret);
    }
    if (ch !== ' ') {
      var hh = document.createElement('span');
      hh.className = 'hrt'; hh.textContent = ['💗','💖','💕'][i % 3];
      hh.style.left = (20 + Math.random() * 60) + '%'; hh.style.top = '40%';
      hh.style.fontSize = (14 + Math.random() * 10) + 'px';
      hh.style.setProperty('--dx', (Math.random() * 50 - 25) + 'px');
      wrap.appendChild(hh);
      setTimeout(function(){ hh.remove(); }, 2100);
    }
    later(nextCh, 110);
  })();
}

var tries = 0;
function ask() {
  tries = 0;
  show(steps(3) + '<div class="ico">🥺</div><h1>So... ' + HER + ',</h1><h1 class="hot">will you go out with me?</h1><div id="yesbox"><button class="btn" id="yes">Yes 💖</button></div><div id="zone"><button id="no" style="left:38%;top:36px">No 🙈</button><small>(good luck catching it)</small></div>');
  var no = document.getElementById('no'), zone = document.getElementById('zone'), surrendered = false;
  var taunts = ['No 🙈','Too slow 😜','Nope!','Missed 😝','Try harder 😂','Can\'t catch me 🏃','Just say yes 🥹','Pretty please? 🥺'];
  function surrender() {
    surrendered = true;
    no.textContent = 'okay okay, just Yes 🥺';
    no.style.transform = 'scale(.8)';
    no.style.left = '50%'; no.style.top = '40px'; no.style.marginLeft = '-' + (no.offsetWidth * .4) + 'px';
    later(function(){
      var y2 = document.createElement('button');
      y2.className = 'btn'; y2.id = 'yes2'; y2.textContent = 'Yes 💖';
      y2.onclick = celebrate;
      document.getElementById('yesbox').appendChild(y2);
      zone.remove();
      pop();
    }, 1200);
  }
  function dodge(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (surrendered) return;
    tries++;
    buzz(15);
    if (tries >= 7) { surrender(); return; }
    no.textContent = taunts[tries % taunts.length];
    no.style.transform = 'scale(' + Math.max(.5, 1 - tries * .09) + ')';
    var w = zone.clientWidth - no.offsetWidth - 6, h = zone.clientHeight - no.offsetHeight - 24;
    no.style.left = Math.max(3, Math.random() * w) + 'px';
    no.style.top = Math.max(3, Math.random() * h) + 'px';
  }
  ['pointerenter','pointerdown','click'].forEach(function(ev){ no.addEventListener(ev, dodge); });
  document.getElementById('yes').onclick = celebrate;
}

function celebrate() {
  var yb = document.getElementById('yes'), yr = yb ? yb.getBoundingClientRect() : null;
  var ox = yr ? yr.left + yr.width / 2 : innerWidth / 2, oy = yr ? yr.top + yr.height / 2 : innerHeight / 2;
  show('<div class="ico">🎉</div><h1>You said yes!</h1><p>I\'m smiling so hard right now. Okay, look up from your phone... I\'m right here 👀</p><p class="from">– ' + ME + '</p><div class="mini line" style="animation-delay:2.6s"><div class="mart">💿</div><div class="mtx"><small>Now playing for ' + HER + '</small><b>' + SONG.title + '</b><span>' + SONG.artist + '</span></div><button id="mp" aria-label="Play or pause">▶</button><div class="pbar"><i id="pf"></i></div></div><div class="btns line" style="animation-delay:3.4s"><button class="btn" id="pick">Pick our first date 🌷</button></div>');
  var mp = document.getElementById('mp'), pf = document.getElementById('pf');
  mp.onclick = function() {
    if (snd) { if (snd.paused) { snd.play(); mp.textContent = '⏸'; } else { snd.pause(); mp.textContent = '▶'; } }
    else if (SONG.spotify) window.open(SONG.spotify, '_blank');
    else mp.textContent = '🎵';
  };
  document.getElementById('pick').onclick = function(){ pop(); pickDate(); };
  if (snd) {
    snd.currentTime = 0; snd.volume = 1;
    snd.play().catch(function(){});
    mp.textContent = '⏸';
    snd.ontimeupdate = function(){
      var d = Math.min(snd.duration || SONG.clipSeconds, SONG.clipSeconds);
      var b = document.getElementById('pf'); if (b) b.style.width = Math.min(100, snd.currentTime / d * 100) + '%';
      if (snd.currentTime > d - 3) snd.volume = Math.max(0, (d - snd.currentTime) / 3);
      if (snd.currentTime >= d) snd.onended();
    };
    snd.onended = function(){ snd.pause(); snd.volume = 1; var m = document.getElementById('mp'); if (m) m.textContent = '▶'; };
  }
  sparkle(); buzz([30, 40, 30]);
  flowers();
  confetti();
  tulipBurst(ox, oy);
}

// 📆 calendar helpers
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function todayISO(){
  var t = new Date();
  return t.getFullYear() + '-' + pad2(t.getMonth() + 1) + '-' + pad2(t.getDate());
}
function fmtDate(s){
  var p = String(s).split('-');
  var dt = new Date(+p[0], (+p[1]) - 1, +p[2]);
  try {
    return dt.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  } catch (e) {
    return s;
  }
}

function pickDate() {
  var h = steps(4) + '<div class="ico">📅</div><h1>Pick our first date</h1><p>No pressure, just choose what sounds nice 💗</p><div class="opts" id="actOpts">';
  DATES.forEach(function(d, i){ h += '<button class="opt" data-i="' + i + '">' + d.e + ' ' + d.t + '</button>'; });
  h += '</div><div class="datepick"><label for="dp">📆 Calendar date</label><input type="date" id="dp" min="' + todayISO() + '"><button class="btn" id="dpOk" disabled>Lock it in 💖</button></div><p id="dpMsg" style="font-size:14px;margin:8px 0 0"></p>';
  show(h);

  var picked = null, when = '', err = '';
  var ok = document.getElementById('dpOk');
  var inp = document.getElementById('dp');
  var msg = document.getElementById('dpMsg');

  function sync(){
    ok.disabled = !(picked && when);
    if (err) { msg.textContent = err; return; }
    if (!picked) { msg.textContent = 'Pick an activity first 💗'; return; }
    if (!when)   { msg.textContent = 'Now pick a date on the calendar 📆'; return; }
    msg.textContent = '';
  }

  Array.prototype.forEach.call(card.querySelectorAll('#actOpts .opt'), function(b){
    b.onclick = function(){
      pop(); buzz(20);
      Array.prototype.forEach.call(card.querySelectorAll('#actOpts .opt'), function(o){
        o.classList.remove('good');
        o.textContent = o.getAttribute('data-label') || o.textContent;
      });
      picked = DATES[+b.getAttribute('data-i')];
      b.classList.add('good');
      b.textContent = '✓ ' + picked.e + ' ' + picked.t;
      sync();
    };
    b.setAttribute('data-label', b.textContent);
  });

  inp.onchange = function(){
    when = inp.value;
    if (when && when < inp.min) {
      when = ''; inp.value = '';
      err = 'Pick a date from today onward 📆';
    } else {
      err = '';
    }
    sync();
  };

  ok.onclick = function(){
    if (!picked || !when) return;
    pop(); buzz(25);
    chosen(picked, when);
  };
  sync();
}

function chosen(d, when) {
  var whenTxt = when ? fmtDate(when) : '';
  var msg = 'Hi ' + ME + '! For our first date I pick: ' + d.e + ' ' + d.t + (whenTxt ? ' on ' + whenTxt : '') + ' 💖';
  var link = REPLY.sms ? 'sms:' + REPLY.sms + '?&body=' + encodeURIComponent(msg)
           : REPLY.email ? 'mailto:' + REPLY.email + '?subject=' + encodeURIComponent('Our first date 💖') + '&body=' + encodeURIComponent(msg) : '';
  var h = steps(4) + '<div class="ico">' + d.e + '</div><h1>' + d.t + ', it\'s a date!</h1>' + (whenTxt ? '<div class="when">📆 ' + whenTxt + '</div>' : '') + '<p>' + (link ? 'Tap below to send me your pick 💌' : 'Now tell ' + ME + ' your pick so he can plan it 💌') + '</p>';
  h += '<div class="btns">' + (link ? '<a class="btn" style="text-decoration:none" href="' + link + '">Send my pick 💌</a>' : '') + '<button class="ghost" id="re">↺ Watch again</button><button class="ghost" id="bk">← Change date</button></div>';
  show(h);
  document.getElementById('bk').onclick = pickDate;
  document.getElementById('re').onclick = restart;
  sparkle(); gardenBloom();
}

function restart() {
  clearAll();
  if (snd) { snd.pause(); snd.currentTime = 0; snd.volume = 1; }
  document.querySelectorAll('.garden,.petal').forEach(function(n){ n.remove(); });
  ['c','t'].forEach(function(id){ var c = document.getElementById(id); c.getContext('2d').clearRect(0, 0, c.width, c.height); });
  floaters();
  intro();
}

// 🌷 tulip explosion
function drawTulip(x, size, col, shade, light) {
  x.lineCap = 'round';
  x.strokeStyle = '#3fbf6e'; x.lineWidth = size * .09;
  x.beginPath(); x.moveTo(0, size * .3); x.quadraticCurveTo(size * .06, size * .8, 0, size * 1.25); x.stroke();
  x.fillStyle = '#58d68d';
  x.beginPath(); x.moveTo(0, size * 1.0); x.quadraticCurveTo(size * .5, size * .85, size * .42, size * .5); x.quadraticCurveTo(size * .12, size * .7, 0, size * 1.0); x.fill();
  x.fillStyle = shade;
  x.beginPath(); x.moveTo(-size * .42, -size * .5); x.quadraticCurveTo(-size * .56, size * .12, 0, size * .38); x.quadraticCurveTo(-size * .1, -size * .1, -size * .42, -size * .5); x.fill();
  x.beginPath(); x.moveTo(size * .42, -size * .5); x.quadraticCurveTo(size * .56, size * .12, 0, size * .38); x.quadraticCurveTo(size * .1, -size * .1, size * .42, -size * .5); x.fill();
  var g = x.createLinearGradient(0, -size * .6, 0, size * .4);
  g.addColorStop(0, light); g.addColorStop(1, col);
  x.fillStyle = g;
  x.beginPath(); x.moveTo(-size * .3, -size * .42); x.quadraticCurveTo(-size * .38, size * .22, 0, size * .4); x.quadraticCurveTo(size * .38, size * .22, size * .3, -size * .42);
  x.lineTo(size * .14, -size * .2); x.lineTo(0, -size * .66); x.lineTo(-size * .14, -size * .2); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = size * .05;
  x.beginPath(); x.moveTo(-size * .14, -size * .05); x.quadraticCurveTo(-size * .18, size * .12, -size * .06, size * .26); x.stroke();
}

function tulipBurst(ox, oy) {
  var c = document.getElementById('t'), x = c.getContext('2d');
  var dpr = Math.min(devicePixelRatio || 1, 2);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  var W = innerWidth, H = innerHeight, u = Math.min(W, H) / 700 + .55;
  var pal = [['#ff2d87','#d4156b','#ff9ccc'],['#ff6fb5','#e04b97','#ffd0e8'],['#ffb81c','#e09a00','#fff0a8'],['#b57cff','#8f55e0','#e4d0ff'],['#ff5a5f','#d93a40','#ffb3b5'],['#ffffff','#f3c6df','#ffffff']];
  var ps = [], sparks = [];
  function launch(n, px, py, power, delay) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = (5 + Math.random() * 12) * power * u;
      ps.push({x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4 * u, rot: a + Math.PI / 2, vr: (Math.random() - .5) * .16,
        size: (26 + Math.random() * 38) * u, pal: pal[(Math.random() * pal.length) | 0], t: -delay, life: 150 + Math.random() * 70});
    }
    for (var j = 0; j < 40; j++) {
      var b = Math.random() * Math.PI * 2, v = (3 + Math.random() * 11) * power * u;
      sparks.push({x: px, y: py, vx: Math.cos(b) * v, vy: Math.sin(b) * v, r: 2 + Math.random() * 3, t: -delay, col: ['#fff','#ffe066','#ff8ccb','#d4b5ff'][j % 4]});
    }
  }
  launch(36, ox, oy, 1, 0);
  later(function(){ launch(26, W * .2, H * .6, .85, 0); launch(26, W * .8, H * .6, .85, 0); buzz(15); }, 650);
  later(function(){ launch(30, W / 2, H * .45, 1.05, 0); sparkle(); buzz(15); }, 1300);
  var ring = 0;
  (function loop() {
    x.clearRect(0, 0, W, H);
    ring += 1;
    if (ring < 28) {
      x.save(); x.globalAlpha = 1 - ring / 28; x.lineWidth = 10 * (1 - ring / 28) + 1; x.strokeStyle = '#ff8ccb';
      x.beginPath(); x.arc(ox, oy, ring * 22 * u, 0, 7); x.stroke(); x.restore();
    }
    sparks.forEach(function(p){
      p.t++; if (p.t < 0 || p.t > 55) return;
      p.x += p.vx; p.y += p.vy; p.vy += .18; p.vx *= .97;
      x.globalAlpha = 1 - p.t / 55; x.fillStyle = p.col;
      x.beginPath(); x.arc(p.x, p.y, Math.max(.1, p.r * (1 - p.t / 80)), 0, 7); x.fill();
    });
    var alive = 0;
    ps.forEach(function(p){
      p.t++; if (p.t < 0) { alive++; return; }
      if (p.t > p.life) return;
      alive++;
      p.x += p.vx; p.y += p.vy; p.vy += .22 * u; p.vx *= .985; p.vy *= .995; p.rot += p.vr;
      var grow = Math.min(1, .2 + p.t / 14), fade = p.t > p.life - 30 ? (p.life - p.t) / 30 : 1;
      x.save(); x.globalAlpha = Math.max(0, fade); x.translate(p.x, p.y); x.rotate(p.rot); x.scale(grow, grow);
      drawTulip(x, p.size, p.pal[0], p.pal[1], p.pal[2]);
      x.restore();
    });
    if (alive) requestAnimationFrame(loop); else x.clearRect(0, 0, W, H);
  })();
}

var F = ['🌷','🌸','🌷','🌺','💐','🌷','🌼'];
function flowers() {
  fl.innerHTML = '';
  for (var i = 0; i < 40; i++) {
    var s = document.createElement('span');
    s.textContent = F[i % F.length];
    s.style.left = (Math.random() * 100) + '%';
    s.style.fontSize = (22 + Math.random() * 34) + 'px';
    s.style.opacity = .85;
    s.style.animationDuration = (6 + Math.random() * 8) + 's';
    s.style.animationDelay = (-Math.random() * 12) + 's';
    fl.appendChild(s);
  }
  for (var j = 0; j < 45; j++) {
    var p = document.createElement('div');
    p.className = 'petal';
    p.textContent = F[j % F.length];
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.fontSize = (20 + Math.random() * 22) + 'px';
    p.style.animationDuration = (3.5 + Math.random() * 3.5) + 's';
    p.style.animationDelay = (Math.random() * 4) + 's';
    document.body.appendChild(p);
  }
  // small garden: tulips bloom from the bottom after the burst
  var g = document.createElement('div');
  g.className = 'garden';
  for (var k = 0; k < 9; k++) {
    var f = document.createElement('span');
    f.textContent = F[(k * 3) % F.length];
    f.style.fontSize = (46 + Math.random() * 34) + 'px';
    f.style.animationDelay = (2.4 + k * .25) + 's,' + (-k * .45) + 's';
    g.appendChild(f);
  }
  document.body.appendChild(g);
}
function gardenBloom() { // extra row when she picks a date
  if (document.querySelector('.garden.g2')) return;
  var g = document.createElement('div');
  g.className = 'garden g2';
  for (var k = 0; k < 7; k++) {
    var f = document.createElement('span');
    f.textContent = ['🌷','🌷','🌱','🌷','🌼'][k % 5];
    f.style.fontSize = (30 + Math.random() * 26) + 'px';
    f.style.animationDelay = (k * .15) + 's,' + (-k * .6) + 's';
    g.appendChild(f);
  }
  document.body.appendChild(g);
}

function confetti() {
  var c = document.getElementById('c'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  var cols = ['#ff2d87','#ff8ccb','#ffb81c','#ffe066','#7ae5c8','#b57cff'];
  var ps = [];
  for (var i = 0; i < 160; i++) ps.push({x: Math.random() * c.width, y: -20 - Math.random() * c.height * .6, r: 4 + Math.random() * 6, vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4, col: cols[i % 6], rot: Math.random() * 6});
  var t = 0;
  (function f() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(function(p){ p.y += p.vy; p.x += p.vx; p.rot += .12; x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.fillStyle = p.col; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); });
    if (++t < 300) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height);
  })();
}

// ✨ sparkle trail that follows finger / cursor
(function(){
  var c = document.getElementById('sp'), x = c.getContext('2d'), W, H, dots = [], last = 0;
  function size() { var d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); }
  size(); addEventListener('resize', size);
  var cols = ['#fff','#ffe066','#ff8ccb','#d4b5ff','#9fe8d5'];
  function add(e) {
    var now = Date.now(); if (now - last < 30) return; last = now;
    for (var i = 0; i < 2; i++) dots.push({x: e.clientX + (Math.random() - .5) * 14, y: e.clientY + (Math.random() - .5) * 14, vx: (Math.random() - .5) * 1.2, vy: Math.random() * 1.2 + .3, r: 2 + Math.random() * 3, a: 1, col: cols[(Math.random() * cols.length) | 0]});
  }
  addEventListener('pointermove', add, {passive:true});
  addEventListener('pointerdown', add, {passive:true});
  function star(px, py, r) { x.beginPath(); for (var i = 0; i < 8; i++) { var rr = i % 2 ? r * .4 : r, a = i * Math.PI / 4; x.lineTo(px + Math.cos(a) * rr, py + Math.sin(a) * rr); } x.closePath(); x.fill(); }
  (function loop() {
    x.clearRect(0, 0, W, H);
    dots = dots.filter(function(d){ return d.a > .02; });
    dots.forEach(function(d){ d.x += d.vx; d.y += d.vy; d.vy += .03; d.a *= .94; x.globalAlpha = d.a; x.fillStyle = d.col; star(d.x, d.y, d.r * 1.6); });
    x.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();
})();

intro();
</script>
