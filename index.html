<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little surprise for you 💌</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
:root{--g1:#ffd1e3;--g2:#ffe9a8;--g3:#c9f0ff;--card:#ffffff;--text:#4a1d3a;--muted:#8a4f72;--accent:#ff4f86;--accent2:#ff9a3c;--line:#ffb3cf;--shadow:0 14px 0 rgba(255,79,134,.18),0 20px 40px rgba(255,79,134,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#3a1230;--g2:#2a1a3f;--g3:#10243f;--card:#2b1830;--text:#ffe9f4;--muted:#e0aecb;--accent:#ff6f9f;--accent2:#ffb25c;--line:#7a3a62;--shadow:0 14px 0 rgba(0,0,0,.25),0 20px 40px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--g1:#3a1230;--g2:#2a1a3f;--g3:#10243f;--card:#2b1830;--text:#ffe9f4;--muted:#e0aecb;--accent:#ff6f9f;--accent2:#ffb25c;--line:#7a3a62;--shadow:0 14px 0 rgba(0,0,0,.25),0 20px 40px rgba(0,0,0,.5)}
html,body{height:100%;margin:0}
body{font-family:"Fredoka","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;overflow:hidden;
background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3),var(--g1));background-size:300% 300%;animation:bg 12s ease infinite}
@keyframes bg{50%{background-position:100% 100%}}
.floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.floaters span{position:absolute;bottom:-50px;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg)}}
.card{position:relative;background:var(--card);box-shadow:var(--shadow);border:4px solid var(--line);border-radius:36px;padding:30px 22px 28px;width:min(90vw,430px);max-width:100%;max-height:94%;overflow-y:auto;text-align:center;animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.emoji{font-size:68px;display:inline-block;animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}
h1{font-size:28px;margin:6px 0 8px;line-height:1.2;font-weight:700}
.big{color:var(--accent);font-size:32px}
p{font-size:19px;line-height:1.5;color:var(--muted);margin:10px 0;font-weight:400}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);transform:scale(1.4)}
.btns{display:flex;flex-direction:column;gap:12px;margin-top:18px;align-items:center}
button{font:inherit;font-weight:600;font-size:20px;border:0;border-radius:999px;padding:14px 32px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .12s;-webkit-tap-highlight-color:transparent}
button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
button.alt{background:var(--card);color:var(--text);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px) rotate(-2deg)}60%{transform:translateX(10px) rotate(2deg)}}
.line{opacity:0;transform:translateY(14px) scale(.95);animation:in .7s forwards}
@keyframes in{to{opacity:1;transform:none}}
#yesbox{display:flex;justify-content:center;padding:14px 0 26px}
#yes{font-size:26px;padding:18px 44px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#zone{position:relative;height:150px;border:3px dashed var(--line);border-radius:22px;overflow:hidden}
#zone small{position:absolute;left:0;right:0;bottom:6px;color:var(--muted);font-size:13px;opacity:.8}
#no{position:absolute;font-size:17px;padding:10px 22px;transition:left .25s cubic-bezier(.3,1.6,.5,1),top .25s cubic-bezier(.3,1.6,.5,1),transform .2s}
.pop{position:fixed;pointer-events:none;font-size:26px;z-index:6;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(120deg);opacity:0}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div class="floaters" id="fl"></div>
<div class="card" id="card"></div>
<canvas id="c"></canvas>
<script>
// ✏️ PERSONALIZE THESE
var HER = "you";   // her name, e.g. "Maria"
var ME = "me";     // your name, e.g. "Juan"
var LINES = [
  "These past few months of talking to you have become my favorite part of the day.",
  "You make ordinary days feel lighter, and I catch myself smiling at my phone like a goofball.",
  "So I decided to be brave and tell you the truth: I really like you."
];

var card = document.getElementById('card');
var fl = document.getElementById('fl');
for (var i = 0; i < 22; i++) {
  var s = document.createElement('span');
  s.textContent = ['💗','✨','🌸','💌','🎈','⭐'][i % 6];
  s.style.left = (Math.random() * 100) + '%';
  s.style.fontSize = (18 + Math.random() * 26) + 'px';
  s.style.opacity = .55;
  s.style.animationDuration = (7 + Math.random() * 9) + 's';
  s.style.animationDelay = (-Math.random() * 14) + 's';
  fl.appendChild(s);
}

function dots(n) { var h = '<div class="dots">'; for (var i = 0; i < 4; i++) h += '<i class="' + (i === n ? 'on' : '') + '"></i>'; return h + '</div>'; }
function show(html) { card.innerHTML = html; card.style.animation = 'none'; card.offsetHeight; card.style.animation = ''; }
function burst(e) {
  var r = e.target.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (var i = 0; i < 8; i++) {
    var p = document.createElement('div'); p.className = 'pop';
    p.textContent = ['💖','✨','⭐','🌸'][i % 4];
    p.style.left = cx + 'px'; p.style.top = cy + 'px';
    var a = Math.random() * 6.28, d = 60 + Math.random() * 60;
    p.style.setProperty('--dx', Math.cos(a) * d + 'px'); p.style.setProperty('--dy', Math.sin(a) * d + 'px');
    document.body.appendChild(p); setTimeout(function(el){ el.remove(); }.bind(null, p), 1000);
  }
}

function intro() {
  show(dots(0) + '<div class="emoji">🎁</div><h1>Heyyy ' + HER + '!</h1><p>I made you a tiny surprise. It takes about a minute, I promise 🤞</p><div class="btns"><button id="go">Open it ✨</button></div>');
  document.getElementById('go').onclick = function(e){ burst(e); setTimeout(quiz, 250); };
}

function quiz() {
  show(dots(1) + '<div class="emoji">🤔</div><h1>Quick quiz first!</h1><p>Who has been my favorite person to talk to lately?</p><div class="btns"><button class="alt" id="a">The mailman 📬</button><button class="alt" id="b">You 💛</button><button class="alt" id="d">My phone charger 🔌</button></div><p id="msg" style="min-height:28px"></p>');
  var oops = ['Nice try 😏 Try again!', 'Wrong! Even my charger says so 🙄', 'Hmm, think harder 👀'], n = 0;
  ['a','d'].forEach(function(id){
    document.getElementById(id).onclick = function(){
      card.classList.remove('shake'); card.offsetHeight; card.classList.add('shake');
      document.getElementById('msg').textContent = oops[n++ % oops.length];
    };
  });
  document.getElementById('b').onclick = function(e){ burst(e); setTimeout(letter, 300); };
}

function letter() {
  var h = dots(2) + '<div class="emoji">💌</div><h1>The real answer 💕</h1>';
  LINES.forEach(function(l, i){ h += '<p class="line" style="animation-delay:' + (i * 1.4 + .3) + 's">' + l + '</p>'; });
  h += '<div class="btns line" style="animation-delay:' + (LINES.length * 1.4 + .6) + 's"><button id="nx">Keep going 👉</button></div>';
  show(h);
  document.getElementById('nx').onclick = ask;
}

var tries = 0;
function ask() {
  show(dots(3) + '<div class="emoji">🥺</div><h1>So... ' + HER + ',</h1><h1 class="big">will you go out with me?</h1><div id="yesbox"><button id="yes">Yes 💖</button></div><div id="zone"><button class="alt" id="no" style="left:40%;top:40px">No 🙈</button><small>(good luck catching it)</small></div>');
  var no = document.getElementById('no'), zone = document.getElementById('zone');
  var taunts = ['No 🙈','Too slow 😜','Nope!','Missed 😝','Try harder 😂','Can\'t catch me 🏃','Just say yes 🥹','Pretty please? 🥺'];
  function dodge(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    tries++;
    no.textContent = taunts[tries % taunts.length];
    var w = zone.clientWidth - no.offsetWidth - 6, h = zone.clientHeight - no.offsetHeight - 24;
    no.style.left = Math.max(3, Math.random() * w) + 'px';
    no.style.top = Math.max(3, Math.random() * h) + 'px';
    no.style.transform = 'scale(' + Math.max(.65, 1 - tries * .04) + ')';
  }
  no.addEventListener('pointerenter', dodge);
  no.addEventListener('pointerdown', dodge);
  no.addEventListener('click', dodge);
  document.getElementById('yes').onclick = celebrate;
}

function celebrate() {
  show('<div class="emoji">🥹🎉</div><h1>You just made my whole week!</h1><p>Okay now look up from your phone... I\'m right here 👀</p><p style="font-size:16px">– ' + ME + '</p>');
  confetti();
}

function confetti() {
  var c = document.getElementById('c'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  var cols = ['#ff4f86','#ff9a3c','#ffd166','#4cc9f0','#7ae582','#b388ff'];
  var ps = [];
  for (var i = 0; i < 180; i++) ps.push({x: Math.random() * c.width, y: -20 - Math.random() * c.height * .6, r: 4 + Math.random() * 6, vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4, col: cols[i % 6], rot: Math.random() * 6});
  var t = 0;
  (function f() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(function(p){ p.y += p.vy; p.x += p.vx; p.rot += .12; x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.fillStyle = p.col; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); });
    if (++t < 320) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height);
  })();
}

intro();
</script>
</body>
</html>
